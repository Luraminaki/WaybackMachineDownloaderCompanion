[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wayback-machine-downloader-companion"
version = "0.4.0"
description = "Companion CLI tools for wayback-machine-downloader: find missing resources, download them, and merge snapshot folders."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Luraminaki" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Luraminaki/WaybackMachineDownloaderCompanion"

[project.optional-dependencies]
dev = ["ruff>=0.8", "basedpyright>=1.40", "pytest>=8.0", "pylint>=3.3", "radon>=6", "vulture>=2.14"]

[project.scripts]
wmdc = "wayback_machine_downloader_companion.cli_launcher:cli"
wmdc-merge = "wayback_machine_downloader_companion.cli_merge:cli"
wmdc-find = "wayback_machine_downloader_companion.cli_find:cli"
wmdc-download = "wayback_machine_downloader_companion.cli_download:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/wayback_machine_downloader_companion"]

[tool.ruff]
# Lint against the oldest supported Python (see requires-python): newer syntax is flagged.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "PL", "N", "SIM", "RUF", "D", "PERF",
    "TC",       # type-only imports under `if TYPE_CHECKING:`
]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
strict = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Expected values in assertions are literals by nature.
"tests/*" = ["PLR2004"]

[tool.basedpyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
# Type-check against the oldest supported Python (see requires-python).
pythonVersion = "3.10"
typeCheckingMode = "recommended"
# Library typing gaps, not project code (same choice as pyBones).
reportAny = "none"
reportExplicitAny = "none"
reportMissingTypeArgument = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
# Same family, from test lambdas given to `monkeypatch.setattr` (typed `Any`).
reportUnknownLambdaType = "none"
# `typing.override` only exists from Python 3.12, and the package supports 3.10 with no
# dependencies (typing_extensions would be one).
reportImplicitOverride = "none"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.similarities]
min-similarity-lines = 8

[tool.pylint.design]
# The HTML parser holds its settings, three result sets and per-page state.
max-attributes = 8

[tool.pylint."messages control"]
disable = [
    # Flags dataclasses and test fakes: data holders by design.
    "too-few-public-methods",
    # `assert x == []` makes pytest print the unexpected items; `assert not x` doesn't.
    "use-implicit-booleaness-not-comparison",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
